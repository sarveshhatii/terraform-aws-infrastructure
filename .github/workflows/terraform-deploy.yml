name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-deploy:
    name: Apply Terraform Infrastructure
    runs-on: ubuntu-latest
    environment: terraform-production

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: Debug GitHub OIDC claims (using github-script)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('issuer:', payload.iss);
            console.log('audience:', payload.aud);
            console.log('subject:', payload.sub);
            console.log('repository_id:', payload.repository_id);
            console.log('repository_owner_id:', payload.repository_owner_id);

      - name: Debug GitHub OIDC claims (using bash/python)
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          OIDC_TOKEN="$OIDC_TOKEN" python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              key: claims.get(key)
              for key in [
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_id",
                  "repository_owner_id",
                  "ref",
                  "event_name"
              ]
          }, indent=2))
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::020671572525:role/GitHubActionsTerraformInfraRole
          aws-region: ap-south-1

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Review Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply Terraform plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan